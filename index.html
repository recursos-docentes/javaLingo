<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out both; }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 1.5s linear infinite; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    // --- ICONOS ---
    const mkIco = (d) => ({ className = "w-4 h-4", style, onClick, title } = {}) => (
      <svg className={className} style={style} onClick={onClick} title={title}
        viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
        strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: d }} />
    );
    const BookOpen = mkIco('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>');
    const Award = mkIco('<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>');
    const Heart = mkIco('<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>');
    const Zap = mkIco('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>');
    const Play = mkIco('<polygon points="5 3 19 12 5 21 5 3"/>');
    const Volume2 = mkIco('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>');
    const Check = mkIco('<path d="M20 6 9 17 4 12"/>');
    const Lock = mkIco('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>');

    // --- DATOS Y FUNCIONES BASE ---
    const levelsData = [ /* TU ARRAY DE NIVELES */ ];
    const classroomExercises = [ /* TU ARRAY DE EJERCICIOS */ ];
    const playgroundTemplates = [ /* TU ARRAY DE TEMPLATES */ ];
    
    const playSound = (type) => { /* TU LÓGICA DE AUDIO */ };
    const highlightJavaCode = (c) => c; // Placeholder si no tienes la librería
    const sendToOneCompiler = (c) => { /* TU FUNCIÓN */ };
    const toB64 = (s) => btoa(s);
    const fromB64 = (s) => atob(s);

    function App() {
      // --- ESTADOS ---
      const [xp, setXp] = useState(() => Number(localStorage.getItem('jl2_xp') || 0));
      const [hearts, setHearts] = useState(() => Number(localStorage.getItem('jl2_hearts') || 5));
      const [streak, setStreak] = useState(() => Number(localStorage.getItem('jl2_streak') || 1));
      const [unlockedLevels, setUnlockedLevels] = useState(() => JSON.parse(localStorage.getItem('jl2_unlocked') || '[1]'));
      const [screen, setScreen] = useState('dashboard');
      
      // --- ESTADOS DE SEGURIDAD Y EDITOR ---
      const [studentCode, setStudentCode] = useState(`public class Main {\n  public static void main(String[] args) {\n    \n  }\n}`);
      const [validationMsgs, setValidationMsgs] = useState([]);

      // --- LÓGICA DE VALIDACIÓN (NUEVO) ---
      const handleCheck = () => {
        const errors = [];
        if (!/public\s+static\s+void\s+main\s*\(\s*String\s*\[\s*\]\s+args\s*\)/.test(studentCode)) {
          errors.push("Falta el método principal: 'public static void main(String[] args)'.");
        }
        const openBraces = (studentCode.match(/\{/g) || []).length;
        const closeBraces = (studentCode.match(/\}/g) || []).length;
        if (openBraces === 0 || openBraces !== closeBraces) {
          errors.push("Error en la estructura de llaves { }. Revisa que estén todas cerradas.");
        }
        if (!studentCode.includes(';')) {
          errors.push("Falta al menos un punto y coma (;).");
        }

        if (errors.length === 0) {
          setValidationMsgs([]);
          playSound('success');
          const iframe = document.getElementById('oc-iframe');
          if (iframe) {
            iframe.contentWindow.postMessage({
              eventType: 'populateCode',
              language: 'java',
              files: [{ name: 'Main.java', content: studentCode }]
            }, '*');
          }
        } else {
          setValidationMsgs(errors);
          playSound('error');
        }
      };

      // --- AQUÍ DEBERÍAS TENER EL RESTO DE TUS useEffects ORIGINALES ---
      // (Mantén aquí todo el resto de tu lógica: niveles, guardado, etc.)

    return (
        <div className="p-6 bg-slate-50 min-h-screen">
          <h2 className="text-xl font-bold mb-4">Editor Protegido</h2>
          
          {/* EDITOR CON BLOQUEOS DE SEGURIDAD */}
          <textarea
            className="w-full h-64 p-4 bg-slate-900 text-emerald-400 font-mono rounded border-2 border-slate-700"
            value={studentCode}
            onChange={(e) => setStudentCode(e.target.value)}
            onPaste={(e) => { 
              e.preventDefault(); 
              alert("¡Atención! Debes escribir el código manualmente para aprender mejor."); 
            }}
            onCopy={(e) => e.preventDefault()}
            onCut={(e) => e.preventDefault()}
            onContextMenu={(e) => e.preventDefault()}
            placeholder="Escribe tu código aquí..."
          />

          {/* BOTÓN DE ACCIÓN */}
          <button 
            onClick={handleCheck}
            className="mt-4 px-6 py-2 bg-indigo-600 text-white rounded font-bold hover:bg-indigo-700 transition"
          >
            Validar y Ejecutar
          </button>

          {/* LISTA DE ERRORES */}
          {validationMsgs.length > 0 && (
            <div className="mt-4 p-4 bg-red-100 text-red-700 rounded border border-red-400 animate-fadeIn">
              <p className="font-bold">⚠ Correcciones necesarias:</p>
              <ul className="list-disc ml-5">
                {validationMsgs.map((err, i) => <li key={i}>{err}</li>)}
              </ul>
            </div>
          )}

          {/* IFRAME DE ONECOMPILER */}
          <div className="mt-6">
            <iframe 
              id="oc-iframe" 
              src="https://onecompiler.com/java" 
              className="w-full h-96 rounded shadow-lg"
            />
          </div>
        </div>
      );
    }

    // --- RENDERIZADO FINAL ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
